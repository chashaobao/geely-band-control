name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: band/package-lock.json
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        shell: pwsh
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build paired applications and run checks
        shell: powershell
        run: ./scripts/build.ps1
